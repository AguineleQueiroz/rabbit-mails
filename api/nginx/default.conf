server {
    listen 80;
    root /var/www/api/public;
    index index.php;

    # Compressão de respostas JSON
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    # Todas as requisições passam pelo index.php (front controller)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Passa arquivos .php para o PHP-FPM via FastCGI
    location ~ \.php$ {
        fastcgi_pass   api:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;

        # Timeouts adequados para chamadas de fila
        fastcgi_read_timeout 60s;
    }

    # Bloqueia acesso a arquivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Logs de acesso e erro
    access_log /var/log/nginx/api-access.log;
    error_log  /var/log/nginx/api-error.log;
}
